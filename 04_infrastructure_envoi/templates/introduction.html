<!--
  Gabarit statique, non branché à un moteur d'envoi pour l'instant.
  Les {{ ... }} indiquent les variables prévues pour un futur rendu
  Jinja2, une fois le module 4 réellement codé.
-->
<!DOCTYPE html>
<html lang="fr">
<head><meta charset="utf-8"></head>
<body>
  <p>Bonjour {{ prenom }},</p>
  <p>{{ message_email }}</p>
  <p>—</p>
  <p><small>Si vous ne souhaitez plus recevoir de message de ma part,
  répondez "STOP" à cet email.</small></p>
</body>
</html>
